[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dzq-verify"
version = "1.3.0"
description = "Reference verifier for dzq/1.0 signed gratitudes (.dzq files)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["cryptography>=3.1"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Specification = "https://github.com/WheelReinvent/dzq"

[project.scripts]
dzq = "dzq.__main__:main"

[tool.setuptools]
packages = ["dzq"]
