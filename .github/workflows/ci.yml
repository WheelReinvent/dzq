name: ci

on:
  push:
  pull_request:

jobs:
  reference:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install cryptography
      - name: Vectors match the generator
        run: python3 tools/gen_vectors.py --check
      - name: Reference verifier passes every vector
        run: python3 -m unittest discover -s reference/python/tests -v
      - name: Schema SAIDs
        run: |
          python3 - <<'EOF'
          import json, sys
          sys.path.insert(0, "reference/python")
          from dzq.cesr import blake3_said, SAID_PLACEHOLDER
          for name, info in json.load(open("schemas/index.json")).items():
              text = open("schemas/" + name, encoding="utf-8").read()
              said = info["said"]
              assert blake3_said(text.replace(said, SAID_PLACEHOLDER, 1)) == said, name
              assert json.loads(text)["$id"] == said, name
          from dzq import types
          import glob
          for f in glob.glob("examples/types/*.json"):
              types.load(f)
          print("schema SAIDs ok; type documents ok")
          EOF
      - name: Base types match the reference
        run: python3 tools/make_types.py --check
      - name: CLI walk-through (README)
        run: |
          pip install ./reference/python
          cd "$(mktemp -d)"
          dzq init alice && dzq init bob
          dzq sign --as alice.id --type gratitude --to "$(dzq whoami bob.id)" title="Thank you" message="For fixing my bike." category=help -o thanks.dzq
          dzq verify thanks.dzq
          dzq type new acme:board-post --public "area*:64" --private "text*:2000" "photo@"
          dzq sign --as alice.id --type acme:board-post --to "?aid=$(dzq whoami bob.id)" area=Podil text="A bike for a kid" -o post.dzq
          rm -r types && dzq verify post.dzq
